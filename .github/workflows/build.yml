name: Build Linux and macOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linux system dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglx-mesa0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libopengl0 libxcb-cursor0 libnss3 libasound2

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "ITDDesktop" \
          --collect-all PyQt6 \
          --add-data "Data:Data" \
          --add-data "QtDesigner:QtDesigner" \
          --add-data "Theme:Theme" \
          --add-data "favicon.ico:." \
          main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ITDDesktop-${{ matrix.os }}
        path: dist/ITDDesktop/
