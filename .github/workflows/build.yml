name: Build Linux and macOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Linux system dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglx-mesa0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1 libopengl0 libxcb-cursor0 libnss3 libasound2t64

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --noconfirm --windowed --name "ITDDesktop" \
          --collect-all PyQt6.QtWebEngineWidgets \
          --collect-all PyQt6.QtWebChannel \
          --add-data "Data:app/Data" \
          --add-data "QtDesigner:app/QtDesigner" \
          --add-data "Theme:app/Theme" \
          --add-data "favicon.ico:app" \
          main.py

    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --noconfirm --windowed --name "ITDDesktop" \
          --collect-binaries PyQt6.QtWebEngineCore \
          --collect-data PyQt6.QtWebEngineCore \
          --collect-data PyQt6.QtWebChannel \
          --add-data "Data:app/Data" \
          --add-data "QtDesigner:app/QtDesigner" \
          --add-data "Theme:app/Theme" \
          --add-data "favicon.ico:app" \
          main.py

    - name: Upload Linux Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ITDDesktop-ubuntu-latest
        path: dist/ITDDesktop/

    - name: Upload macOS Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ITDDesktop-macos-latest
        path: dist/ITDDesktop.app/
